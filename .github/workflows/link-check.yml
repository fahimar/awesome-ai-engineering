name: Check links

on:
  push:
    branches: [main]
    paths: ["README.md"]
  # Runs on every PR (no path filter) because this check is required for merging —
  # a path-filtered required check would leave non-README PRs stuck on "Expected"
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — catches links that die over time
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,203,206,301,302,403,429
            --max-retries 2
            --timeout 20
            README.md
          fail: false

      - name: Open issue if links are broken (scheduled runs only)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Link checker found broken links"
          content-filepath: ./lychee/out.md
          labels: broken-link
